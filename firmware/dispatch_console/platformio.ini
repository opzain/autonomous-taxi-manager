; ESP32 dispatch console (Autonomous Taxi Manager). Build: pio run   Upload: pio run -t upload
; The same source runs in the Wokwi simulator (../wokwi).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/Adafruit NeoPixel
