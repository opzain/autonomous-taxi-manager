<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><text x="24" y="34" font-size="20" fill="#111" text-anchor="start" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">System and software architecture (v0.11)</text><text x="24" y="56" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">The simulation core is the dominant component (spec §4); Unity only draws it; the ESP32 is the physical input/feedback device.</text><rect x="30" y="90" width="330" height="640" rx="10" fill="#fbe9e7" stroke="#c62828" stroke-width="2"/><text x="195" y="118" font-size="15" fill="#b71c1c" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">ESP32 dispatch console (firmware v0.4)</text><rect x="50" y="140" width="290" height="78" rx="8" fill="#ffffff" stroke="#e57373" stroke-width="1.5"/><text x="195" y="170" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">7 buttons + KY-040 knob</text><text x="195" y="194" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">debounce 25 ms, long press 600 ms, encoder ISR</text><rect x="50" y="235" width="290" height="78" rx="8" fill="#ffffff" stroke="#e57373" stroke-width="1.5"/><text x="195" y="265" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Self-test mode</text><text x="195" y="289" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">T01–T04 evidence, works without the PC</text><rect x="50" y="330" width="290" height="78" rx="8" fill="#ffffff" stroke="#e57373" stroke-width="1.5"/><text x="195" y="360" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Console mode</text><text x="195" y="384" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">draws S/T/R/F/M lines on the 2.8&quot; ILI9341</text><rect x="50" y="425" width="290" height="78" rx="8" fill="#ffffff" stroke="#e57373" stroke-width="1.5"/><text x="195" y="455" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Buzzer (2N2222)</text><text x="195" y="479" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">non-blocking cue patterns (Z|…)</text><rect x="50" y="520" width="290" height="78" rx="8" fill="#ffffff" stroke="#e57373" stroke-width="1.5"/><text x="195" y="550" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">WS2812B-8 stick</text><text x="195" y="574" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">fleet colours (L|…), optional</text><rect x="50" y="615" width="290" height="78" rx="8" fill="#ffffff" stroke="#e57373" stroke-width="1.5"/><text x="195" y="645" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Link watchdog</text><text x="195" y="669" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">LINK LOST after 4 s of silence</text><rect x="390" y="330" width="170" height="130" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="475" y="360" font-size="15" fill="#8d6e00" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">USB serial</text><text x="475" y="382" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">115200 baud, ASCII lines</text><text x="475" y="404" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">→ B, E, K, H</text><text x="475" y="426" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">← S T R F M Z L</text><text x="475" y="448" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">~1.2 KB/s, diff only</text><polyline points="360,370 388,370" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><polyline points="390,420 362,420" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="590" y="90" width="780" height="640" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="980" y="118" font-size="15" fill="#0d47a1" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">PC: Unity 6 (URP) — C#</text><rect x="610" y="140" width="230" height="90" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/><text x="725.0" y="170" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">SerialLink</text><text x="725.0" y="192" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">background thread, COM-port auto</text><text x="725.0" y="208" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">search</text><rect x="610" y="250" width="230" height="90" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/><text x="725.0" y="280" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">ConsoleBridge</text><text x="725.0" y="302" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">input → console, page → TFT,</text><text x="725.0" y="318" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">cues</text><rect x="610" y="360" width="230" height="90" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/><text x="725.0" y="390" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Keyboard / mouse</text><text x="725.0" y="412" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">same actions without hardware</text><rect x="880" y="250" width="220" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="990.0" y="280" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">DispatchConsole</text><text x="990.0" y="302" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Core: pages, selection,</text><text x="990.0" y="318" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">commands</text><rect x="1130" y="140" width="220" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="1240.0" y="170" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Simulation</text><text x="1240.0" y="192" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Core: requests, fleet, routes</text><text x="1240.0" y="208" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">(Dijkstra), traffic events,</text><text x="1240.0" y="224" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">energy, economy, satisfaction,</text><text x="1240.0" y="240" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">rival pricing, save/replay</text><rect x="880" y="470" width="220" height="100" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/><text x="990.0" y="500" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">SimulationDriver</text><text x="990.0" y="522" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">ticks · taxis on roads · pins,</text><text x="990.0" y="538" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">ribbons, closures, rain, sky</text><rect x="1130" y="470" width="220" height="100" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/><text x="1240.0" y="500" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">DispatchHud</text><text x="1240.0" y="522" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">top bar, page mirror, fleet,</text><text x="1240.0" y="538" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">ticker, labels</text><rect x="880" y="610" width="470" height="90" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="1115.0" y="640" font-size="14" fill="#111" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Procedural 3D BKC world</text><text x="1115.0" y="662" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">roads, 7,500 buildings, traffic, people, weather, sound, camera, menus</text><polyline points="560,395 608,185" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><polyline points="725,230 725,248" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><polyline points="840,295 878,295" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><polyline points="840,405 878,310" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><polyline points="1100,280 1128,260" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arb)" stroke-linejoin="round"/><text x="1112" y="300" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Submit</text><polyline points="1240,340 1240,468" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arb)" stroke-linejoin="round"/><polyline points="1160,340 1000,468" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arb)" stroke-linejoin="round"/><polyline points="990,570 990,608" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><polyline points="880,280 842,280" fill="none" stroke="#37474f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)" stroke-linejoin="round"/><text x="1010" y="760" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Green = engine-free TaxiSim.Core (unit-tested with dotnet test). Blue = Unity World layer.</text></svg>