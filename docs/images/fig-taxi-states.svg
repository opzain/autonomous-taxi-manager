<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><rect width="1240" height="760" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><text x="24" y="34" font-size="20" fill="#111" text-anchor="start" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Taxi state machine — enforced by TaxiStateMachine (illegal changes are refused, test T06)</text><text x="24" y="58" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Spec §11 mapping: ASSIGNED + EN_ROUTE_PICKUP = TO_PICKUP · PICKUP + EN_ROUTE_DROPOFF = ON_RIDE · COMPLETED = the drop-off event.</text><text x="24" y="78" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Any moving state (TO_PICKUP, ON_RIDE, TO_CHARGER, RELOCATING) can also become DELAYED or OFFLINE; one arrow of each is drawn.</text><rect x="75.0" y="305.0" width="170" height="50" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="160" y="335" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">IDLE</text><rect x="435.0" y="305.0" width="170" height="50" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/><text x="520" y="335" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">TO_PICKUP</text><rect x="795.0" y="305.0" width="170" height="50" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="880" y="335" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">ON_RIDE</text><rect x="1045.0" y="575.0" width="170" height="50" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="1130" y="605" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">OFFLINE</text><rect x="75.0" y="575.0" width="170" height="50" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="2"/><text x="160" y="605" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">RELOCATING</text><rect x="435.0" y="575.0" width="170" height="50" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/><text x="520" y="605" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">TO_CHARGER</text><rect x="795.0" y="575.0" width="170" height="50" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/><text x="880" y="605" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">CHARGING</text><rect x="435.0" y="135.0" width="170" height="50" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/><text x="520" y="165" font-size="15" fill="#102027" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">DELAYED</text><polyline points="245.0,322 435.0,322" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="284.5" y="310.0" width="111.0" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="340.0" y="324.0" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Assign (ACCEPT)</text><polyline points="605.0,322 795.0,322" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="637.9" y="310.0" width="124.19999999999999" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="700.0" y="324.0" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">reached passenger</text><polyline points="880,355.0 880,420 160,420 160,355.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="601.6" y="408" width="196.79999999999998" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="700" y="422" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">drop-off: fare, satisfaction</text><polyline points="490,305.0 490,185.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="384.5" y="233" width="111.0" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="440" y="247" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">closure / fault</text><polyline points="550,185.0 550,305.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="544.7" y="233" width="150.6" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="620" y="247" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Reroute (auto 10 min)</text><polyline points="965.0,330 1130,330 1130,575.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="1087.7" y="458" width="84.6" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="1130" y="472" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">battery 0 %</text><polyline points="1045.0,600 965.0,600" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="939.6" y="588.0" width="130.8" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="1005.0" y="602.0" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">towed ₹500, 20 min</text><polyline points="200,355.0 200,470 480,470 480,575.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="291.0" y="458" width="78.0" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="330" y="472" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">SendCharge</text><polyline points="605.0,600 795.0,600" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="641.2" y="588.0" width="117.6" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="700.0" y="602.0" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">arrived / queued</text><polyline points="880,625.0 880,700 60,700 60,330 75.0,330" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="391.4" y="688" width="157.2" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="470" y="702" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">full / Release charger</text><polyline points="130,355.0 130,575.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="77.6" y="448" width="64.8" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="110" y="462" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Relocate</text><polyline points="170,575.0 170,355.0" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="175.9" y="508" width="58.199999999999996" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="205" y="522" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">arrived</text><polyline points="245.0,588 300,588 300,344 435.0,344" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="round"/><rect x="274.2" y="513" width="51.599999999999994" height="18" rx="4" fill="#fff" fill-opacity="0.95"/><text x="300" y="527" font-size="11.5" fill="#37474f" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">Assign</text></svg>