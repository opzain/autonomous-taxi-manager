<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890"><rect width="1120" height="890" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs><text x="24" y="34" font-size="20" fill="#111" text-anchor="start" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">Dispatch console enclosure — top panel (1:4, dimensions in mm)</text><text x="24" y="58" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">240 × 140 mm footprint, 65 mm tall, 3 mm acrylic / MDF top on 4 × M3 × 25 mm standoffs. Rear: USB-C cut-out for the ESP32.</text><rect x="60" y="90" width="960.0" height="560.0" rx="18" fill="#f5f0e6" stroke="#5d4037" stroke-width="3"/><rect x="148.0" y="170.0" width="240.0" height="184.0" rx="4" fill="#263238" stroke="#000" stroke-width="2"/><text x="268.0" y="267.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">TFT window 60 × 46</text><text x="268.0" y="372.0" font-size="11" fill="#5d4037" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">2.8&quot; ILI9341 (module 86 × 50, M3 holes 80 × 44)</text><circle cx="600.0" cy="290.0" r="24.0" fill="#90caf9" stroke="#1565c0" stroke-width="2"/><text x="600.0" y="294.0" font-size="11" fill="#0d47a1" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">UP</text><circle cx="600.0" cy="466.0" r="24.0" fill="#90caf9" stroke="#1565c0" stroke-width="2"/><text x="600.0" y="470.0" font-size="11" fill="#0d47a1" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">DOWN</text><circle cx="51