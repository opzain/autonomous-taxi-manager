="330.0" cy="528.0" r="9.2" fill="hsl(240,90%,60%)"/><circle cx="358.0" cy="528.0" r="9.2" fill="hsl(280,90%,60%)"/><text x="260.0" y="566.0" font-size="11" fill="#5d4037" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">WS2812B-8 window 56 × 11</text><circle cx="859.0" cy="558.0" r="4.8" fill="#5d4037"/><circle cx="873.0" cy="558.0" r="4.8" fill="#5d4037"/><circle cx="887.0" cy="558.0" r="4.8" fill="#5d4037"/><circle cx="901.0" cy="558.0" r="4.8" fill="#5d4037"/><text x="880.0" y="576.0" font-size="11" fill="#5d4037" text-anchor="middle" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">buzzer holes</text><circle cx="84.0" cy="114.0" r="6.4" fill="#fff" stroke="#5d4037" stroke-width="1.5"/><circle cx="996.0" cy="114.0" r="6.4" fill="#fff" stroke="#5d4037" stroke-width="1.5"/><circle cx="84.0" cy="626.0" r="6.4" fill="#fff" stroke="#5d4037" stroke-width="1.5"/><circle cx="996.0" cy="626.0" r="6.4" fill="#fff" stroke="#5d4037" stroke-width="1.5"/><polyline points="60,680.0 1020.0,680.0" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linejoin="round"/><text x="540.0" y="702.0" font-size="13" fill="#5d4037" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">240 mm</text><polyline points="1050.0,90 1050.0,650.0" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linejoin="round"/><text x="1066.0" y="370.0" font-size="13" fill="#5d4037" text-anchor="middle" font-weight="bold" font-family="Segoe UI,Arial,sans-serif">140</text><text x="24" y="740.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">• Button pitch 22 mm D-pad, 28 mm action row (spec: ≥ 18–20 mm). 12 mm caps on 6 × 6 mm switches (or 12 mm panel switches, Ø12 holes).</text><text x="24" y="764.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">• Labels engraved or printed next to each control: ↑ ↓ ← → BACK ACCEPT REJECT; colour-coded caps match the TFT colours.</text><text x="24" y="788.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">• Inside: breadboard on the base plate, ESP32 on female jumpers / header strip, cable tie anchors; USB-C slot 12 × 7 mm in the rear wall.</text><text x="24" y="812.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI,Arial,sans-serif">• Sides: 4 × MDF strips 65 mm high, or a 3D-printed tray; vent slots behind the ESP32.</text></svg>